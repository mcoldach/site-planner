# Label mapping for per-zone dimensional tables.
#
# How matching works: the transformer normalizes both the label_path
# category (strips trailing "[N]" footnote markers and the surrounding
# "(minimum)" / "(maximum)" suffix) and the row label (lowercase, collapse
# whitespace). It looks up category in `categories` to derive the rule
# family + constraint_kind, then looks up the normalized row label in
# `rows`. If the row label is a "composite" (combines multiple rules or
# rule+scope), the lookup returns a composite key handled in composites.py.
#
# Strict policy: ambiguous rows → unmapped_table_labels, no claim emitted.

categories:
  "setbacks":
    rule_family: setback
    constraint_kind: scalar_min
  "lot standards":
    rule_family: lot
    constraint_kind: scalar_min   # most rows; lot_coverage rows override below
  "lot coverage":
    rule_family: lot
    rule_key: lot.coverage
    constraint_kind: scalar_max
  "lot and density standards":
    rule_family: lot
    constraint_kind: scalar_min   # rows override
  "height":
    rule_family: building
    rule_key: building.height
    constraint_kind: scalar_max
  "other standards":
    rule_family: other
    constraint_kind: scalar_min   # rows override

# Simple row labels: normalized label → mapping fragment.
# rule_key + scope additions; constraint_kind inherits from category unless
# overridden here.
rows:
  # Setback row labels
  "front":
    rule_key: setback.front
  "front (minimum)":
    rule_key: setback.front
  "side":
    rule_key: setback.side
  "side (minimum)":
    rule_key: setback.side
  "side - interior":
    rule_key: setback.side
  "rear":
    rule_key: setback.rear
  "rear (minimum)":
    rule_key: setback.rear
  "corner lot - side street":
    rule_key: setback.side_street
  "front parking setback (minimum)":
    rule_key: setback.front
    scope:
      building_element: parking
  "house":
    rule_key: setback.front
    scope:
      building_element: principal_building
  "house - general":
    rule_key: setback.front
    scope:
      building_element: principal_building
  "detached garage or carport":
    rule_key: setback.rear
    scope:
      building_element: accessory_building

  # Lot row labels
  "lot area (minimum)":
    rule_key: lot.area
    constraint_kind: scalar_min
  "lot width (minimum)":
    rule_key: lot.width
    constraint_kind: scalar_min
  "lot coverage (maximum)":
    rule_key: lot.coverage
    constraint_kind: scalar_max
  "minimum lot size":
    rule_key: lot.area
    constraint_kind: scalar_min

  # Lot coverage sub-bands (under "Lot Coverage (maximum)" category)
  "building equal to or exceeding 18 ft in height":
    rule_key: lot.coverage
    scope:
      building_height_condition: gte_18ft
  "buildings less than 18 ft in height":
    rule_key: lot.coverage
    scope:
      building_height_condition: lt_18ft

  # Height row labels
  "building height":
    rule_key: building.height
  "residential use":
    rule_key: building.height
    scope:
      use_class: residential
  "non-residential use":
    rule_key: building.height
    scope:
      use_class: non_residential

# Composite handlers: row labels that fuse multiple rules or rule+scope.
# The transformer dispatches to a named Python function in composites.py;
# the function returns one or more (rule_key, constraint_kind, scope) tuples.
composites:
  "front and side street": split_front_and_side_street
  "front and side street frontages": split_front_and_side_street
  "house and garage adjacent to collector, parkway, or arterial street":
    house_garage_adjacent_arterial
  "house and garage adjacent to collector parkway, or arterial street":
    house_garage_adjacent_arterial
  "house and attached garage or carport, general":
    house_and_attached_garage_general
  "garage - general (from back of sidewalk)":
    garage_general_from_sidewalk
  "detached garage or carport accessed from alley or rear access easement":
    detached_garage_from_alley
  "adjacent to existing or planned residential zone or use":
    adjacent_residential_zone_or_use

# Rows that are section dividers / category headers fused into a label,
# not actual rules. These map to nothing and are NOT logged as unmapped
# (we recognize them as non-rule rows).
ignore_rows:
  - "minimum"
  - "maximum"
  - "non-residential uses"
  - "residential uses"
  - "all residential structures"
  - "all residential structures except garages"
  - "non-residential structures"
  - "residential structures"
  - "duplex on one lot"
  - "single-family attached"
  - "interior, non-residential use"
  - "interior, residential use"
  - "corner lot side street, non-residential use"
  - "corner lot side street, residential use"
  - "street-loaded garage"

# ───────────────────────────────────────────────────────────────────────────
# Per-zone-matrix vocabulary (CS UDC 7.4.2-A…D). Selected when ex.shape ==
# "per_zone_matrix". Same logical rules as the dimensional block, but the
# label strings and category vocabulary differ, and some strings the
# dimensional block IGNORES are real rules here ("maximum", dwelling types).
#
# SAFETY NOTE on bare "maximum": it resolves to lot.coverage ONLY because the
# category gate requires label_path[0] to resolve, and we deliberately do NOT
# define a "front" category here. So 7.4.2-C's build-to ["Front","Maximum"]
# fails the gate and unmaps cleanly instead of mis-binding to lot.coverage.
# When C's build-to range lands (next session), handle Front Min/Max via a
# composite keyed on the full path — never the bare leaf.
per_zone_matrix:
  categories:
    "lot standards":
      constraint_kind: scalar_min          # rows override (density -> max)
    "lot area":
      constraint_kind: scalar_min
    "lot coverage":
      constraint_kind: scalar_max
    "lots containing only buildings less than 18 ft in height":
      constraint_kind: scalar_max
    "setbacks":
      constraint_kind: scalar_min
    "height":
      constraint_kind: scalar_max
    "district standards": {constraint_kind: scalar_min}

  rows:
    # Density (new rule_key this shape)
    "residential density (maximum)":
      rule_key: density.residential
      constraint_kind: scalar_max

    # Lot area by dwelling type (scope.dwelling_type)
    "single-family detached":
      rule_key: lot.area
      constraint_kind: scalar_min
      scope: {dwelling_type: single_family_detached}
    "single-family attached":
      rule_key: lot.area
      constraint_kind: scalar_min
      scope: {dwelling_type: single_family_attached}
    "two-family (duplex)":
      rule_key: lot.area
      constraint_kind: scalar_min
      scope: {dwelling_type: two_family}
    "multi-family - one-story structure":
      rule_key: lot.area
      constraint_kind: scalar_min
      scope: {dwelling_type: multifamily_one_story}
    "multi-family - two-story structure":
      rule_key: lot.area
      constraint_kind: scalar_min
      scope: {dwelling_type: multifamily_two_story}
    # The parser puts a newline after "three-", so normalization yields
    # "three- story". Both spellings keyed defensively.
    "multi-family - three- story structure":
      rule_key: lot.area
      constraint_kind: scalar_min
      scope: {dwelling_type: multifamily_three_story}
    "multi-family - three-story structure":
      rule_key: lot.area
      constraint_kind: scalar_min
      scope: {dwelling_type: multifamily_three_story}
    "multi-family - four-story structure":
      rule_key: lot.area
      constraint_kind: scalar_min
      scope: {dwelling_type: multifamily_four_story}

    # Lot dimensions (also cover C/D footnote-free leaves)
    "lot area (minimum)":
      rule_key: lot.area
      constraint_kind: scalar_min
    "lot width (minimum)":
      rule_key: lot.width
      constraint_kind: scalar_min

    # Lot coverage
    "maximum":
      rule_key: lot.coverage
      constraint_kind: scalar_max
    "lot coverage (maximum)":
      rule_key: lot.coverage
      constraint_kind: scalar_max
    "lots containing any building(s) equal to exceeding 18 ft in height":
      rule_key: lot.coverage
      constraint_kind: scalar_max
      scope: {building_height_condition: gte_18ft}
    "5,000 - 6,500 sf lot":
      rule_key: lot.coverage
      constraint_kind: scalar_max
      scope: {building_height_condition: lt_18ft, lot_area_condition: 5000_6500_sf}
    "6,501 - 7,500 sf lot":
      rule_key: lot.coverage
      constraint_kind: scalar_max
      scope: {building_height_condition: lt_18ft, lot_area_condition: 6501_7500_sf}
    "7,501 - 8,500 sf lot":
      rule_key: lot.coverage
      constraint_kind: scalar_max
      scope: {building_height_condition: lt_18ft, lot_area_condition: 7501_8500_sf}
    "8,501+ sf lot":
      rule_key: lot.coverage
      constraint_kind: scalar_max
      scope: {building_height_condition: lt_18ft, lot_area_condition: gte_8501_sf}

    # Setbacks
    "front (minimum)":
      rule_key: setback.front
      constraint_kind: scalar_min
    "house - general (from property line)":
      rule_key: setback.front
      constraint_kind: scalar_min
      scope: {building_element: principal_building}
    "side (minimum)":
      rule_key: setback.side
      constraint_kind: scalar_min
    "rear (minimum)":
      rule_key: setback.rear
      constraint_kind: scalar_min
    "corner lot - side street (minimum)":
      rule_key: setback.side_street
      constraint_kind: scalar_min
    "front parking setback (minimum)":
      rule_key: setback.front
      constraint_kind: scalar_min
      scope: {building_element: parking}

    # Height (C/D)
    "building height (maximum)":
      rule_key: building.height
      constraint_kind: scalar_max

    # District minimum size (C/D matrix; constrains the district, not a lot)
    "district area (minimum)": {rule_key: district.area, constraint_kind: scalar_min}

  composites: {}
  ignore_rows: []

# ───────────────────────────────────────────────────────────────────────────
# Per-use-ratio vocabulary (CS UDC 7.4.10-E parking-by-use). Selected when
# ex.shape == "per_use_ratio". Rows are keyed on the normalized use-category
# label (label_path[0]); each emits parking.required as a jurisdiction-wide
# ratio scoped by use_class. The "Other → As determined by the Manager" row is
# deliberately absent so it falls through to the non_numeric/prose path.
per_use_ratio:
  rows:
    "applicable residential uses":
      rule_key: parking.required
      constraint_kind: ratio
      scope: {use_class: residential}
    "civic, public, and institutional uses":
      rule_key: parking.required
      constraint_kind: ratio
      scope: {use_class: civic_institutional}
    "commercial uses":
      rule_key: parking.required
      constraint_kind: ratio
      scope: {use_class: commercial}

# ───────────────────────────────────────────────────────────────────────────
# Per-use-loading vocabulary (CS UDC 7.4.10-G off-street loading). Selected
# when ex.shape == "per_use_loading". Rows are keyed on the normalized
# use-category label (label_path[0]).
per_use_loading:
  rows:
    "uses in the eating, drinking, and lodging; office; and retail sales and services categories":
      rule_key: parking.required
      constraint_kind: ratio
      scope: {building_element: loading, use_class: eating_drinking_lodging_office_retail}
    "other nonresidential uses":
      rule_key: parking.required
      constraint_kind: ratio
      scope: {building_element: loading, use_class: other_nonresidential}
